<!DOCTYPE html>
<!-- Declara q este documento usa HTML5 -->

<html lang="pt-BR">
<!-- elementro raiz da página. lang define o idioma -->

<head>
    <!-- informações de bastidores: não aparecem diretamente na tela -->

    <meta charset="UTF-8"> <!-- Codificação de caracteres, garante acentos corretos-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ativa a responsividade em dispositivos móveis -->

    <title>Escola Digital Livre</title>
    <!-- titulo exibido na aba do navegador -->

    <link rel="stylesheet" href="style.css">
    <!-- conecta o arquivo de estilos (CSS) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <!-- Tudo que o usuario vê e interage fica aqui -->

    <header class="header">
        <!-- tag semantica: indica o cabeçalho da página -->

        <div class="header-container">
            <!-- Container que agrupa e centraliza o conteúdo do header -->
            <a href="#" class="logo">
                <!-- Logo clicável, leva para a home -->

                <img src="assets/logo.png" alt="logo Educação Digital Livre" width="60px">

                <span>
                    <!-- span: elemento de texto inline, nãos -->
                    <span class="logo-title">Escola Digital Livre</span> <br>
                    <span class="logo-subtitle">Tecnologia para todos</span>

                </span>
            </a>
            <nav class="main-nav">
                <!-- tag semântica para o menu de mavegação -->

                <a href="index.html" class="nav-link active">Inicio</a>
                <a href="cursos.html" class="nav-link">cursos</a>
                <a href="#" class="nav-link">Sobre</a>
                <a href="#" class="nav-link">Contato</a>
            </nav>

            <div class="header-actions">
                <!-- Agrupa os botões de busca e botão CTA -->
                <div class="search-box">
                    <input type="text" placeholder="Buscar cursos...">
                    <svg xmlns="http://w3.org" viewBox="0 0 512 512" width="20" height="20">
                        <path fill="currentColor"
                            d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.1-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" />
                    </svg>

                </div>

                <button class="btn-primary">Começar Agora</button>

            </div>
        </div>

    </header>

    <main class="main">

    </main>

    <footer class="footer">

    </footer>
</body>

</html>
